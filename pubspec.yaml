name: footstat_pro
description: "Gerenciador de Torneios de Futebol com Flutter e Riverpod"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  google_fonts: ^8.2.1
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/
