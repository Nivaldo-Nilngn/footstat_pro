name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Prepara o Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Baixa as dependências e constrói o Web App
      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release

      # 4. Instala o Firebase CLI e faz o deploy
      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project footstat-pro --token $FIREBASE_TOKEN --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
